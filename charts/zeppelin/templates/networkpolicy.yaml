{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.zeppelin.enabled -}}
{{- $np := .Values.networkPolicy.zeppelin -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ default (include "zeppelin.fullname" .) $np.name }}
  labels:
    {{- include "zeppelin.labels" . | nindent 4 }}
    {{- with $np.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    {{- with $np.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  podSelector:
    {{- if $np.podSelector }}
    {{- toYaml $np.podSelector | nindent 4 }}
    {{- else }}
    matchLabels:
      {{- include "zeppelin.selectorLabels" . | nindent 6 }}
    {{- end }}
  policyTypes:
    {{- toYaml $np.policyTypes | nindent 4 }}
  {{- with $np.ingress }}
  ingress:
    {{- /* tpl lets values use {{ .Release.Namespace }} / {{ .Values.rbac.sparkJobNamespace }} */}}
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  {{- with $np.egress }}
  egress:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
{{- end }}
