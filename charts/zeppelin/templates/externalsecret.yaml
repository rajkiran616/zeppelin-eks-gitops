{{- if and .Values.appSecrets.enabled (eq .Values.appSecrets.source "externalSecrets") -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "zeppelin.fullname" . }}-app
  labels:
    {{- include "zeppelin.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: {{ .Values.appSecrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.appSecrets.externalSecrets.secretStoreName }}
    kind: {{ .Values.appSecrets.externalSecrets.secretStoreKind }}
  target:
    name: {{ .Values.appSecrets.secretName }}
    creationPolicy: Owner
  # Maps every JSON key in the SM secret to a K8s Secret key (then envFrom).
  dataFrom:
    - extract:
        key: {{ .Values.appSecrets.externalSecrets.remoteKey }}
{{- end }}
