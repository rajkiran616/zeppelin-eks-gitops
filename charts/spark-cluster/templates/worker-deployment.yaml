apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spark-cluster.fullname" . }}-worker
  labels:
    {{- include "spark-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "spark-cluster.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "spark-cluster.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "spark-cluster.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: spark-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: SPARK_NO_DAEMONIZE
              value: "true"
          command:
            - /opt/spark/bin/spark-class
          args:
            - org.apache.spark.deploy.worker.Worker
            - {{ include "spark-cluster.masterUrl" . | quote }}
            - --cores
            - "{{ .Values.worker.cores }}"
            - --memory
            - "{{ .Values.worker.memory }}"
            - --webui-port
            - "{{ .Values.worker.webUiPort }}"
          ports:
            - name: http
              containerPort: {{ .Values.worker.webUiPort }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: work
              mountPath: /opt/spark/work
      volumes:
        - name: tmp
          emptyDir: {}
        - name: work
          emptyDir: {}
