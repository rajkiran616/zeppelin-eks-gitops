# ClusterSecretStore for AWS Secrets Manager (applied once after ESO is healthy)
# Placeholders: REPLACE_ME_REGION, REPLACE_ME_ACCOUNT_ID
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: aws-secrets-manager
    app.kubernetes.io/part-of: zeppelin-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_ME_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
