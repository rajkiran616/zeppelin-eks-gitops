# Production EC2NodeClass — larger disks for Spark shuffle spill, AL2023, IMDSv2.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: zeppelin-prod
  labels:
    app.kubernetes.io/part-of: zeppelin-platform
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  role: REPLACE_ME_KARPENTER_NODE_ROLE
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE_ME_CLUSTER_NAME
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE_ME_CLUSTER_NAME
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi
        volumeType: gp3
        iops: 6000
        throughput: 250
        encrypted: true
        deleteOnTermination: true
  tags:
    Name: zeppelin-prod
    Environment: prod
    Project: zeppelin-spark
    karpenter.sh/discovery: REPLACE_ME_CLUSTER_NAME
