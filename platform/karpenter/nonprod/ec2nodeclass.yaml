# Shared EC2NodeClass for non-production (dev + staging).
# Smaller root volumes; AL2023; IMDSv2 required.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: zeppelin-nonprod
  labels:
    app.kubernetes.io/part-of: zeppelin-platform
    environment: nonprod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  role: REPLACE_ME_KARPENTER_NODE_ROLE
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE_ME_CLUSTER_NAME
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE_ME_CLUSTER_NAME
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true
  tags:
    Name: zeppelin-nonprod
    Environment: nonprod
    Project: zeppelin-spark
    karpenter.sh/discovery: REPLACE_ME_CLUSTER_NAME
