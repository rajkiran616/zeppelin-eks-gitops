# Local Kind / Docker Desktop — same architecture as EKS (HA masters + ZooKeeper),
# smaller resources, no Karpenter taints. ZK uses emptyDir (no PVC).
environment: kind
fullnameOverride: spark

image:
  repository: apache/spark
  tag: "3.5.9"

ha:
  enabled: true
  masters: 2
  zookeeper:
    replicaCount: 3
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    nodeSelector: {}
    tolerations: []
    persistence:
      enabled: false

master:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  tolerations: []

worker:
  replicaCount: 2
  cores: 1
  memory: 1g
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1500Mi
  nodeSelector: {}
  tolerations: []
