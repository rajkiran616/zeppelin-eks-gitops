environment: staging
fullnameOverride: spark

image:
  repository: apache/spark
  tag: "3.5.9"

# QA: HA masters + ZooKeeper (same pattern as prod, smaller nodes)
ha:
  enabled: true
  masters: 2
  zookeeper:
    replicaCount: 3
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    nodeSelector:
      workload.apache.org/component: spark
    tolerations:
      - key: workload.apache.org/dedicated
        operator: Equal
        value: spark
        effect: NoSchedule
    persistence:
      enabled: true
      size: 5Gi

master:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  nodeSelector:
    workload.apache.org/component: spark
  tolerations:
    - key: workload.apache.org/dedicated
      operator: Equal
      value: spark
      effect: NoSchedule

worker:
  replicaCount: 2
  cores: 2
  memory: 2g
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  nodeSelector:
    workload.apache.org/component: spark
  tolerations:
    - key: workload.apache.org/dedicated
      operator: Equal
      value: spark
      effect: NoSchedule
